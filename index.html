<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5B4BE8"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Maya"><title>Maya · Entreno</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet"><style id="css">
:root{--ink:#1E1B3A;--ink2:#5D5A78;--ink3:#75718F;--bg:#F6F5FC;--card:#fff;--line:#E7E5F3;--v:#5B4BE8;--vd:#3E30C4;--vl:#ECE9FF;--y:#FFC845;--coral:#FF7A66;--mint:#2FBF97;--r:22px;--sh:0 1px 2px rgba(30,27,58,.04),0 6px 20px rgba(30,27,58,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
/* header */
.hero{padding-top:calc(26px + env(safe-area-inset-top)) !important;}
.hero{background:radial-gradient(120% 140% at 100% 0%,#7B6CFF 0%,var(--v) 45%,var(--vd) 100%);color:#fff;padding:26px 0 70px;border-radius:0 0 34px 34px}
.hero-top{display:flex;align-items:center;gap:16px}
.avatar{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.22)}
.avatar svg{width:34px;height:34px;fill:var(--v)}
.hello{font-size:13px;font-weight:700;opacity:.8;letter-spacing:.02em}
.dogname{font-size:28px;font-weight:900;line-height:1.1;display:flex;align-items:center;gap:8px}
.edit{opacity:.7;font-size:12px;font-weight:800;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:99px}
.edit:hover{opacity:1}
.lvl{margin-left:auto;text-align:right}
.lvl-pill{display:inline-flex;align-items:center;gap:6px;background:var(--y);color:var(--ink);font-weight:900;font-size:13px;padding:6px 12px;border-radius:99px}
.xpbar{width:130px;height:6px;border-radius:9px;background:rgba(255,255,255,.22);margin-top:8px;margin-left:auto;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--y);border-radius:9px}
.xptxt{font-size:11px;opacity:.75;margin-top:4px;font-weight:700}
.stats{display:grid;grid-template-columns:minmax(0,260px);gap:10px;margin-top:22px}
.stat{background:rgba(255,255,255,.12);border-radius:18px;padding:12px 14px}
.stat b{font-size:22px;font-weight:900;display:block;line-height:1.1}
.stat span{font-size:12px;opacity:.8;font-weight:700}
.namein{background:rgba(255,255,255,.18);border:0;border-radius:12px;padding:4px 10px;color:#fff;font-size:24px;font-weight:900;width:180px;outline:2px solid rgba(255,255,255,.4)}
/* tabs */
.tabs{display:flex;gap:6px;background:#fff;border-radius:99px;padding:6px;box-shadow:var(--sh);margin:-28px auto 24px;width:max-content;max-width:100%;position:sticky;top:10px;z-index:5}
.tab{padding:10px 20px;border-radius:99px;font-weight:800;color:var(--ink2);font-size:14px}
.tab.on{background:var(--v);color:#fff}
/* sections */
h2{font-size:20px;font-weight:900;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--ink2);font-size:14px;margin-bottom:14px}
.sec{margin-bottom:30px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.goal{background:#fff;border-radius:20px;padding:16px;text-align:left;box-shadow:var(--sh);border:2px solid transparent;transition:transform .15s,border-color .15s;position:relative}
.goal:hover{transform:translateY(-2px)}
.goal.on{border-color:var(--c)}
.goal .ic{width:42px;height:42px;border-radius:14px;background:var(--t);display:grid;place-items:center;margin-bottom:12px}
.goal .ic svg{width:22px;height:22px;stroke:var(--c);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.goal b{display:block;font-weight:900;font-size:15px;line-height:1.2}
.goal small{color:var(--ink3);font-weight:700;font-size:12px}
.goal .chk{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--c);display:none;place-items:center}
.goal.on .chk{display:grid}
.chk svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none}
.mini{height:5px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);border-radius:9px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.plan{display:flex;flex-direction:column;gap:10px}
.exrow{display:flex;align-items:center;gap:14px;padding:14px;background:#fff;border-radius:20px;box-shadow:var(--sh);text-align:left;width:100%}
.exrow .tile{width:54px;height:54px;border-radius:16px;background:var(--t);display:grid;place-items:center;flex:none;position:relative}
.tile svg{width:26px;height:26px;stroke:var(--c);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile .num{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.exrow .mid{flex:1;min-width:0}
.exrow b{font-weight:900;font-size:15px;display:block}
.meta{display:flex;gap:10px;align-items:center;color:var(--ink3);font-size:12px;font-weight:700;margin-top:2px;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--c)}
.go{background:var(--v);color:#fff;font-weight:900;font-size:13px;padding:10px 16px;border-radius:99px;flex:none}
.go:hover{background:var(--vd)}
.go.ghost{background:var(--vl);color:var(--v)}
.badge{font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;background:var(--vl);color:var(--v)}
.badge.done{background:#DDF6EE;color:#13906D}
.badge.new{background:#F1F0F6;color:var(--ink3)}
.week{padding:18px}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:92px;height:92px;flex:none}
.ring b{font-size:26px;font-weight:900}
.days{display:flex;justify-content:space-between;margin-top:16px}
.day{text-align:center;font-size:11px;font-weight:800;color:var(--ink3)}
.day i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#F1F0F6;margin:4px auto 0}
.day.on i{background:var(--mint)}
.day.on i:after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.day.today{color:var(--ink)}
.day.today i{box-shadow:0 0 0 2px var(--v)}
.tipcard{padding:18px;margin-top:14px;background:linear-gradient(135deg,#FFF4D6,#FFE9B8);box-shadow:none}
.tipcard b{font-weight:900;font-size:13px;display:block;margin-bottom:4px}
.tipcard p{font-size:13.5px;color:#5c4a14}
.wk-set{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--ink3);font-weight:700}
.stp{width:32px;height:32px;border-radius:50%;background:#F1F0F6;font-weight:900}
/* library */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{padding:8px 14px;border-radius:99px;background:#fff;box-shadow:var(--sh);font-weight:800;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff}
.search{margin-left:auto;background:#fff;border:0;border-radius:99px;padding:9px 16px;box-shadow:var(--sh);min-width:200px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.excard{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
.excard:hover{transform:translateY(-2px)}
.excard .top{background:var(--t);height:96px;display:grid;place-items:center;position:relative}
.excard .top svg{width:40px;height:40px;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.excard .top .badge{position:absolute;top:10px;right:10px;background:#fff}
.excard .bd{padding:14px 16px 16px}
.excard b{font-weight:900;font-size:16px;display:block}
.excard .cat{font-size:12px;font-weight:800;color:var(--c)}
/* progress */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tl{padding:16px}
.tl b{font-size:28px;font-weight:900;display:block;line-height:1.1}
.tl span{font-size:12px;color:var(--ink2);font-weight:700}
.heat{padding:18px;overflow-x:auto}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;width:max-content}
.hm i{width:14px;height:14px;border-radius:4px;background:#EEEDF5}
.hm i.l1{background:#C9C2FF}.hm i.l2{background:#9587FF}.hm i.l3{background:var(--v)}
.hm i.fut{background:transparent}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--ink3);font-weight:700;margin-top:10px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.bars{padding:18px;display:flex;flex-direction:column;gap:14px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-row .tile{width:36px;height:36px;border-radius:12px;background:var(--t);display:grid;place-items:center;flex:none}
.bar-row .tile svg{width:18px;height:18px}
.bar-row .lab{flex:1}
.bar-row .lab div{display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.bar-row .lab span{color:var(--ink3)}
.bar{height:8px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c)}
.log{padding:6px 18px}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .tile{width:38px;height:38px;border-radius:12px;background:var(--t);display:grid;place-items:center;flex:none}
.li .tile svg{width:18px;height:18px}
.li .mid{flex:1;min-width:0}
.li b{font-weight:800;font-size:14px}
.li small{display:block;color:var(--ink3);font-size:12px;font-weight:700}
.li .note{color:var(--ink2);font-size:13px;font-style:italic;margin-top:2px}
.rate{font-size:12px;font-weight:900;padding:3px 9px;border-radius:99px;white-space:nowrap}
.r1{background:#FFE6E1;color:#C2412E}.r2{background:var(--vl);color:var(--v)}.r3{background:#DDF6EE;color:#13906D}
.del{color:var(--ink3);font-size:12px;font-weight:800;padding:4px 8px;border-radius:8px}
.del:hover,.del.arm{background:#FFE6E1;color:#C2412E}
.empty{padding:28px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-weight:900;font-size:16px;margin-bottom:4px}
/* overlay */
#overlay{position:fixed;inset:0;z-index:50;display:none}
#overlay.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,17,45,.45);backdrop-filter:blur(3px)}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--bg);overflow-y:auto;animation:sl .25s ease}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
.sh-top{background:var(--t);padding:22px 22px 26px;position:relative}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:#fff;font-weight:900;font-size:18px;display:grid;place-items:center;box-shadow:var(--sh)}
.sh-top .tile{width:58px;height:58px;border-radius:18px;background:#fff;display:grid;place-items:center;margin-bottom:12px}
.sh-top .tile svg{width:30px;height:30px}
.sh-top h3{font-size:24px;font-weight:900;line-height:1.15}
.sh-top .cat{font-weight:800;color:var(--c);font-size:13px}
.sh-bd{padding:20px 22px 110px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.fact{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:var(--sh)}
.fact small{display:block;font-size:11px;color:var(--ink3);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.fact b{font-weight:900;font-size:14px}
.h4{font-weight:900;font-size:14px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.steps-l{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps-l li{counter-increment:s;background:#fff;border-radius:16px;padding:12px 14px 12px 48px;position:relative;box-shadow:var(--sh);font-size:14.5px}
.steps-l li:before{content:counter(s);position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--t);color:var(--c);font-weight:900;font-size:13px;display:grid;place-items:center}
.note-b{border-radius:16px;padding:12px 14px;font-size:14px}
.note-b b{display:block;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.n-tip{background:#FFF4D6;color:#5c4a14}.n-bad{background:#FFE6E1;color:#7a2a1d}.n-ok{background:#DDF6EE;color:#0d5c46}
.sh-cta{position:fixed;bottom:0;right:0;width:min(520px,100%);padding:16px 22px;background:linear-gradient(transparent,var(--bg) 30%)}
.big{width:100%;background:var(--v);color:#fff;font-weight:900;font-size:16px;padding:16px;border-radius:18px;box-shadow:0 8px 22px rgba(91,75,232,.35)}
.big:hover{background:var(--vd)}
/* guide */
.guide{position:absolute;inset:0;background:var(--bg);overflow-y:auto;animation:fd .2s ease}
@keyframes fd{from{opacity:0}}
.g-in{max-width:560px;margin:0 auto;padding:18px 20px 40px;min-height:100%;display:flex;flex-direction:column}
.g-head{display:flex;align-items:center;gap:12px}
.g-head .x{position:static}
.g-head b{font-weight:900;font-size:17px;flex:1}
.prog{display:flex;gap:5px;margin:16px 0 18px}
.prog i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--c)}
.stepcard{background:#fff;border-radius:26px;box-shadow:var(--sh);padding:24px;min-height:170px;position:relative}
.stepcard .sn{font-size:12px;font-weight:900;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.stepcard p{font-size:19px;font-weight:800;line-height:1.4;margin-top:8px}
.nav{display:flex;gap:10px;margin-top:12px}
.nav button{flex:1;padding:13px;border-radius:16px;font-weight:900;background:#fff;box-shadow:var(--sh)}
.nav button.pri{background:var(--ink);color:#fff}
.nav button:disabled{opacity:.35;cursor:default}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.timer{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.timer svg{width:110px;height:110px}
.timer .tt{font-size:24px;font-weight:900;fill:var(--ink)}
.timer button{font-weight:900;font-size:13px;background:var(--t);color:var(--c);padding:8px 16px;border-radius:99px}
.timer small{font-size:11px;color:var(--ink3);font-weight:700;text-align:center}
.clk{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.clicker{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD66B,var(--y) 55%,#F0A800);box-shadow:0 8px 0 #D69200,0 12px 22px rgba(214,146,0,.35);display:grid;place-items:center;font-weight:900;color:#6b4a00;font-size:15px;transition:transform .06s,box-shadow .06s;user-select:none;-webkit-tap-highlight-color:transparent}
.clicker:active,.clicker.hit{transform:translateY(6px);box-shadow:0 2px 0 #D69200,0 4px 10px rgba(214,146,0,.3)}
.clk .cnt{font-weight:900;font-size:13px;color:var(--ink2)}
.clk .cnt b{font-size:18px;color:var(--ink)}
.clk small{font-size:11px;color:var(--ink3);font-weight:700}
.g-tip{margin-top:14px}
.finish{margin-top:auto;padding-top:20px}
.rategrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.rt{background:#fff;border-radius:20px;padding:18px 8px;box-shadow:var(--sh);border:2px solid transparent;font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.rt .face{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.rt .face svg{width:26px;height:26px;fill:none;stroke-width:2.2;stroke-linecap:round}
.rt.on{border-color:var(--v)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notes{width:100%;border:0;border-radius:16px;padding:14px;min-height:90px;box-shadow:var(--sh);resize:vertical;outline:none;margin-top:8px}
.celebrate{text-align:center;padding:8px 0 4px}
.celebrate h3{font-size:26px;font-weight:900}
.celebrate p{color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:800;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.rr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.rr:last-child{border:0}
.rr-t{flex:1}.rr-t b{display:block;font-weight:800;font-size:14px}.rr-t small{color:var(--ink3);font-size:12px;font-weight:700}
.rr.ok .rr-t b:after{content:" ✓";color:var(--mint)}
.rcnt{display:flex;align-items:center;gap:6px;font-weight:900}.rcnt span{color:var(--ink3);font-size:12px;margin-left:-4px}
.rck{font-weight:900;font-size:12px;padding:6px 12px;border-radius:99px;background:var(--vl);color:var(--v)}.rr.ok .rck{background:#DDF6EE;color:#13906D}
.cw{display:flex;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line)}.cw:last-child{border:0}.cw b{font-weight:900;min-width:118px}.cw span{color:var(--ink2)}
.vid{display:inline-block;margin-top:10px;background:#fff;color:var(--c);font-weight:900;font-size:13px;padding:8px 14px;border-radius:99px;text-decoration:none;box-shadow:var(--sh)}
.clicker.voz{font-size:16px;line-height:1.05;text-align:center}
.mk{display:flex;gap:6px}.nob{background:#FFE6E1;color:#C2412E;font-weight:900;font-size:13px;padding:7px 14px;border-radius:99px}.mkt{background:#F1F0F6;color:var(--ink2);font-weight:800;font-size:11px;padding:7px 10px;border-radius:99px}
.g80{color:#13906D;font-weight:900}
.gapb{background:#FFF1CC;color:#9A6A00}
.n-gap{background:#FFF1CC;color:#6b4a00}
.pyr{display:flex;flex-direction:column;gap:6px}
.pr{display:grid;grid-template-columns:62px 64px 1fr;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--sh);text-align:left;border:2px solid transparent;font-size:13px}
.pr span{font-weight:900;color:var(--ink3);font-size:12px}.pr b{font-weight:900;font-size:12px;color:#13906D}.pr.dif b{color:#C2412E}.pr em{font-style:normal;font-weight:700}
.pr.dif{margin-left:14px}.pr.on{border-color:var(--c)}
.lvg{font-size:12px;color:var(--ink2);font-weight:700;margin-top:4px}
.gcard{display:flex;gap:16px;align-items:center;padding:16px 18px;margin-bottom:16px}
.gl{width:78px;height:78px;border-radius:22px;background:var(--v);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.gl span{font-size:10px;font-weight:900;letter-spacing:.1em;opacity:.8}.gl b{font-size:30px;font-weight:900;line-height:1}.gl small{font-size:11px;font-weight:800;opacity:.8}
.gm{flex:1}.gm>b{font-weight:900;font-size:15px}.gm p{font-size:13px;color:var(--ink2);margin-top:8px}
.lvs{display:flex;flex-direction:column;gap:6px}

{id:"vinc",cat:"s1",src:1,n:"Vinculación",d:1,m:5,mat:"Nada: ni comida ni juguete",v:"https://vimeo.com/399117868/4318d9ee2f",s:["Solo vosotras dos: sin pelota, sin premios, sin nada más.","Di «{dog}» y a continuación palabras y gestos amigables.","Cuando se interese por ti: caricias de voz y táctiles a su gusto. «Muuuy bien» si aumenta la atención o se acerca.","No la fuerces a acercarse ni la retengas.","Para evaluar: aléjate y ofrécele una nueva posibilidad de acercarse."],tip:"Palabras prohibidas en este ejercicio: ven, toma, mira, aquí o similares. Solo su nombre y palabras amables.",bad:"Usar comida o juguete: aquí buscamos que le interese el vínculo social en sí mismo.",ok:"Al alejarte, vuelve a acercarse y ofrece señales afiliativas. Si deambula sin acercarse, te ve como un «sillón de masaje»; si se aleja o se apacigua, no estaba cómoda."},
{id:"noinf",cat:"s1",src:1,n:"No informativo",d:2,m:3,mat:"Situaciones del día a día",v:"https://vimeo.com/399457920/f9f3a20fdf",s:["Cuando {dog} inicie una acción incorrecta, di «no» con tono tranquilo y positivo.","El «no» es una ayuda, no un enfado: le informa de que eso no es lo que le pides.","En cuanto abandone ese rumbo de acción: «muy bien».","Empieza con situaciones de baja intensidad emocional, que pueda dejar con facilidad."],tip:"Bien montado, el «no» le ayuda a tener éxito y a coordinarse contigo sin conflicto.",bad:"Usarlo con enfado o subiendo el tono: deja de ser informativo.",ok:"Al oír «no», abandona voluntariamente lo que había empezado (si la emoción no le supera)."},
{id:"juego",cat:"s1",src:1,n:"Espacio de juego",d:2,m:8,mat:"Juguete de tira o pelota",v:"https://vimeo.com/400399013/b5a13a02de",s:["Activa a {dog} poco a poco con «Ach», como un acelerador.","Juega con el juguete coordinándote con ella: «trae» para que te lo traiga.","Pide «suelta» y, al soltar, «muy bien» y sigue el juego.","Si tiene que buscar el juguete, usa «busca».","Termina siempre con «Nada más» para que se desconecte del juego."],tip:"El juego le enseña a moldear su instinto de caza y a coordinarse contigo en estados de máxima activación. 5–10 min cada vez.",bad:"Acabar sin «Nada más»: le cuesta desconectar y aparece la sobreexcitación.",ok:"Trae, suelta y se desactiva con «Nada más» sin quedarse revolucionada."},

{id:"llamadaprob",cat:"s1",src:1,n:"Llamada · solución de problemas 1",d:2,m:5,mat:"Comida · una pared",v:"https://vimeo.com/399485351/5b601c40c6",s:["Empieza con un par de llamadas sencillas con presión pasiva.","Llámala estando tú de espaldas.","Llámala hacia un lado, y luego hacia el otro.","Llámala de cara a la pared: tendrá que sentarse a tu lado, lo más cerca posible.","Acierto: «muy bien» y premio. Error: «no» informativo y le das otra oportunidad."],tip:"Equivocarse es normal y hasta conveniente: es como comprueba que entiende la conducta.",bad:"Darle la solución tú: la comprensión exige que ella se esfuerce.",ok:"80 % de aciertos (4 de cada 5) para subir de nivel.",pyr:[["R1","Fácil","Llamada directa con presión pasiva (alguien la sujeta), a corta distancia"],["R2","Difícil","Llamada de espaldas, hacia un lado o de cara a la pared"],["R3","Fácil","Vuelve a una llamada directa y sencilla para cerrar con éxito"]]},

{id:"puertabusca",cat:"s1",src:1,n:"Espera en la puerta + busca",d:1,m:2,mat:"Comida para el busca",s:["Antes de salir, pide «espera».","Debe esperar a que abras la puerta y salgas tú primero.","Si se mantiene estable: «ale» para liberarla.","Nada más salir, tírale un «busca» (comida al suelo para olfatear)."],tip:"Hazlo en cada salida: convierte un momento de excitación en autocontrol.",bad:"Salir a la vez que ella si se ha movido: vuelve a empezar con calma.",ok:"Espera estable hasta que sales tú y oye «ale»."},
{id:"permanencia",cat:"s2",src:1,n:"Permanencia formal en sentado",d:2,m:5,mat:"Comida",s:["Pide sentado y la señal de permanencia que te enseñó la educadora.","Trabaja distancia (pasos) y tiempo por separado: sube solo una cosa a la vez.","Vuelve siempre tú junto a {dog} para confirmar con «muy bien» y premiar en posición.","Libera con «ale».","Sigue la pirámide: una repetición fácil, una difícil y otra fácil."],tip:"El objetivo es que gestione la inquietud de verte alejarte. Si se levanta, la repetición difícil era demasiado difícil.",bad:"Subir distancia y tiempo a la vez.",ok:"80 % de aciertos en el nivel antes de subir distancia o tiempo.",gap:"La palabra exacta de permanencia y el criterio para pasar de nivel.",pyr:[["E1 · R1","Fácil","1 paso · 5 s"],["E1 · R2","Difícil","1 paso · 10 s"],["E1 · R3","Fácil","1 paso · 5 s"],["E2 · R1","Fácil","1 paso · 10 s"],["E2 · R2","Difícil","2 pasos · 10 s"],["E2 · R3","Fácil","1 paso · 5 s"]]},
{id:"vamos",cat:"s2",src:1,n:"Vamos {dog}, juega conmigo",d:2,m:5,mat:"Su comedero lleno",s:["Camina con el comedero lleno en la mano.","{dog} tiene que ir a tu lado de forma estable y homogénea.","Si se adelanta o salta al comedero, no avances hasta que se recoloque.","Cuando haya caminado estable a tu lado: «tuyo» y deja el comedero."],tip:"Trabaja la impulsividad: la comida llega por caminar contigo, no por lanzarse.",bad:"Darle el «tuyo» con ella acelerada o saltando.",ok:"Camina estable a tu lado todo el recorrido hasta el «tuyo».",gap:"Distancia o tiempo de recorrido y qué hacer si se lanza al comedero."},
{id:"eh",cat:"s2",src:1,n:"Concentración «¡Eh!»",d:2,m:3,mat:"Comida para luring",s:["Cuando {dog} se distraiga, da un toque de atención suave: «¡Eh!».","Justo después, guíala con comida (luring) hacia el rumbo adecuado.","Cuando retome el rumbo: «muy bien».","Observa su lenguaje corporal: si se aparta, se lame o gira la cabeza, baja la intensidad."],tip:"Es una exigencia suave para captar la atención, nunca un susto.",bad:"Decirlo tan fuerte que provoque apaciguamiento: tiene que sumar atención, no miedo.",ok:"Al oír «¡Eh!» vuelve contigo sin mostrar señales de apaciguamiento.",gap:"Cómo y cuándo retirar el luring tras el «¡Eh!»."},
{id:"pulsa",cat:"s3",src:1,n:"Pulsa si sabes",d:3,m:4,mat:"Comida",s:["Di palabras que conoce («sienta») mezcladas con otras que no («gazpacho»).","{dog} solo debe actuar ante las palabras que conoce.","Si responde a la conocida: «muy bien» y premio.","Si actúa ante una desconocida: «no» informativo, sin enfado.","Usa el mismo tono para todas las palabras: tiene que escuchar, no adivinar."],tip:"Discriminación cognitiva: comprueba que entiende la palabra y no solo tu gesto o tu tono.",bad:"Acompañar la palabra conocida con un gesto: así no sabes si discrimina el sonido.",ok:"80 % de aciertos mezclando conocidas y desconocidas.",gap:"Cuántas palabras por serie y en qué proporción."},
{id:"contar10",cat:"s3",src:1,n:"Contar hasta 10",d:3,m:3,mat:"Plato · 10 trozos de comida",s:["Pide «espera» con el plato delante.","Deja caer los trozos de comida en el plato de uno en uno, contando hasta 10.","Si se lanza antes de tiempo, retira el plato y vuelve a empezar.","Al llegar a 10 y si sigue esperando: «tuyo»."],tip:"Tolerancia a la frustración: ve cómo aumenta su «sueldo» gota a gota.",bad:"Ir demasiado rápido o demasiado lento al principio: busca que gane.",ok:"Espera los 10 trozos sin lanzarse.",gap:"Si se reinicia la cuenta desde cero o desde donde se lanzó."},
{id:"llamadadist",cat:"s3",src:1,n:"Llamada con distracciones",d:3,m:5,mat:"2 personas · comida · juguetes",s:["Calienta con un par de llamadas sencillas sin distracciones.","Llámala mientras está distraída, o mientras otra persona intenta jugar con ella.","Prueba también escondiéndote, o con alguien ofreciéndole comida o juguetes.","Si va hacia la distracción: «no» informativo. Si viene y se sienta: «muy bien» y premio.","Cierra con una llamada sencilla."],tip:"La persona que distrae debe hacerlo de forma controlada: la dificultad la marcas tú.",bad:"Empezar directamente con la distracción más fuerte.",ok:"Viene y se sienta con alguien distrayéndola, 4 de cada 5 veces.",pyr:[["R1","Fácil","Un par de llamadas de calentamiento sin distracciones"],["R2","Difícil","Escondida, o alguien ofreciendo comida o juguetes (usa el «no» si hace falta)"],["R3","Fácil","Una última llamada sencilla para cerrar con éxito"]]},
{id:"sitio",cat:"s4",src:1,n:"A tu sitio",d:2,m:6,mat:"Su cama · comida",s:["Envía a {dog} a su cama lanzando comida sobre ella.","Cuando esté en la cama, premia la permanencia con refuerzos espaciados.","Sigue los tiempos de la pirámide.","Libera con «ale» solo después de haberla premiado en la cama."],tip:"Busca que se aleje de estímulos interesantes para ir a su sitio por sí misma.",bad:"Liberarla justo cuando se levanta: le enseñas que levantarse termina el ejercicio.",ok:"Aguanta la duración del nivel con los refuerzos espaciados.",gap:"Qué palabra usar para enviarla («a tu sitio») y cuándo dejar de lanzar comida.",pyr:[["R1","Fácil","1 min en total · refuerzo cada 15 s"],["R2","Difícil","2 min en total · refuerzo cada 30 s"],["R3","Fácil","3 min · refuerzo cada minuto si tiene fondo; si no, vuelve a una duración menor"]]},
{id:"noesyies",cat:"s4",src:1,n:"Noes y síes",d:2,m:3,mat:"Cuenco con comida",s:["Pon un cuenco con comida a su alcance.","Si se acerca sin permiso: «no» para que se aparte.","Cuando se aparte: «muy bien».","Alterna: a veces «tuyo» para que acceda al cuenco."],tip:"Combina el «no» y el «tuyo»: le enseña que el permiso depende de ti.",bad:"Usar siempre el mismo orden: si lo puede predecir, no está escuchando.",ok:"Se aparta con el «no» y solo accede con el «tuyo».",gap:"Cuántas repeticiones de «no» antes de un «tuyo»."},
{id:"renuncias",cat:"s4",src:1,n:"Pequeñas renuncias",d:2,m:5,mat:"Comida o juguetes fuera de su alcance",s:["Deja comida o juguetes a la vista, fuera del alcance de {dog}.","Ignóralos tú también: no los mires ni intervengas.","Espera hasta que {dog} deje de prestarles atención por sí misma.","Cuando renuncie: «muy bien» con calma."],tip:"Renuncia autónoma: el objetivo es no tener que intervenir de forma constante.",bad:"Decirle «no» todo el rato: entonces no renuncia ella, la frenas tú.",ok:"Deja de interesarse por el objeto sin que intervengas.",gap:"Cuánto tiempo esperar y si hay que premiar la renuncia o no."},
{id:"dirigido",cat:"s56",src:1,n:"Paseo dirigido",d:2,m:10,mat:"Correa",s:["Camina con {dog} a tu lado.","Si se adelanta, da un paso atrás en 45° para recolocarla.","Nada de tirones secos: la recolocación es suave.","Cuando vuelva a tu lado: «muy bien» y seguid."],tip:"Es el paseo por necesidad: aceras con gente, cruces, tramos estrechos.",bad:"Recolocar con tirones de correa.",ok:"Va a tu lado en tramos cortos sin tener que recolocarla."},
{id:"tranquilo",cat:"s56",src:1,n:"Paseo tranquilo",d:1,m:15,mat:"Correa larga",s:["Dile «libre»: {dog} elige el rumbo, pero no el ritmo.","Déjala explorar y olfatear con libertad.","Si tensa la correa: media vuelta.","Modela su rumbo con suavidad, sin bloqueos bruscos."],tip:"Es el paseo de exploración: debe ser la mayor parte del tiempo de calle.",bad:"Dejar que marque el ritmo tirando.",ok:"Explora con la correa floja casi todo el paseo."},
{id:"sintonizado",cat:"s56",src:1,n:"Paseo sintonizado",d:3,m:10,mat:"Correa",s:["Ante algo que le dé miedo, reduce la correa para darle seguridad.","Haz arcos de disipación: rodea el estímulo en curva en lugar de ir de frente.","Llévala hasta una «plaza segura» donde se tranquilice.","Cuando se recupere, seguid el paseo con calma."],tip:"Le das seguridad en las situaciones de miedo: eres su apoyo, no quien la expone.",bad:"Acercarla al estímulo para que se acostumbre.",ok:"Busca tu apoyo y se recupera rápido en la plaza segura.",gap:"Qué cuenta como «plaza segura» y la forma exacta de los arcos de disipación."},
{id:"extensible",cat:"s56",src:1,n:"Correa extensible",d:2,m:10,mat:"Correa extensible",s:["Guía con modelado suave e informativo, no con bloqueos.","Usa pulsaciones cortas del freno para orientarla.","Evita bloquear la correa de forma constante.","Cuando se oriente bien: «muy bien»."],tip:"La extensible informa con pulsaciones, no frena todo el rato.",bad:"Dejarla siempre bloqueada: se acostumbra a la tensión.",ok:"Responde a las pulsaciones sin necesitar bloqueos.",gap:"Cómo son las pulsaciones (frecuencia e intensidad)."},
{id:"extincion",cat:"s56",src:1,n:"Extinción de premios",d:3,m:4,mat:"Comida (cada vez menos)",s:["Pide una conducta conocida y premia con comida.","Pide la conducta sin enseñar comida y refuerza solo con caricias o juego social.","Termina con una conducta muy sencilla y afecto o juego.","Poco a poco, la recompensa pasa a ser vuestra relación."],tip:"El objetivo es que haga las cosas por satisfacción social, no solo por comida.",bad:"Quitar la comida de golpe en conductas que aún no están firmes.",ok:"Hace las conductas conocidas sin comida a la vista, con el mismo entusiasmo.",pyr:[["P1","Fácil","Pide «sienta» y premia con comida"],["P2","Difícil","Pide la conducta sin enseñar comida; al final, solo caricias o juego"],["P3","Fácil","Pide algo muy sencillo y premia con afecto o juego"]]},
{id:"nombre",cat:"extra",n:"Atención al nombre",d:1,m:3,mat:"Premios pequeños",s:["En un sitio tranquilo, di «{dog}» una sola vez con tono alegre.","En cuanto te mire: «muy bien» y premio.","Repite 5–8 veces. Si no te mira en 2 s, haz un ruidito suave, pero no repitas el nombre.","Sube la dificultad: dilo cuando esté olfateando o mirando a otro lado."],tip:"Su nombre debe anunciar cosas buenas. No lo uses nunca para regañar.",bad:"Repetir el nombre varias veces: le enseñas a ignorar las primeras.",ok:"Te mira a la primera 8 de cada 10 veces, con pequeñas distracciones."},
{id:"mirame",cat:"extra",n:"Mírame (contacto visual)",d:1,m:3,mat:"Premios",s:["Sujeta un premio en la mano cerrada, con el brazo estirado hacia un lado.","{dog} mirará la mano. Espera en silencio, sin moverte.","En el instante en que desvíe la mirada a tus ojos: clic y premio.","Cuando lo haga rápido, añade la palabra «mírame» justo antes.","Pide 2–3 segundos de mirada antes del clic."],tip:"Es la base de la atención en el paseo: practícalo en sitios distintos.",bad:"Decirle «mírame» mientras mira la mano: la palabra aún no significa nada.",ok:"Mantiene 3 s de contacto visual con la palabra, en casa y en la calle."},
{id:"tumbado",cat:"extra",n:"Tumbado",d:2,m:5,mat:"Premios · alfombra",s:["Pide sentado y pon un premio en su nariz.","Baja el premio en vertical hasta el suelo, entre sus patas, y aléjalo un poco hacia ti.","Cuando los codos toquen el suelo: clic y premio en el suelo.","Si se levanta, premia aproximaciones: cabeza abajo, hombros abajo…","Retira el señuelo y añade la palabra «tumba»."],tip:"Empieza en una superficie cómoda: en suelo frío cuesta más.",bad:"Ir demasiado rápido. Si falla 2 veces seguidas, vuelve al paso anterior.",ok:"Se tumba con la palabra, sin señuelo, 8 de cada 10 veces."},
{id:"target",cat:"extra",n:"Toque de mano (target)",d:1,m:3,mat:"Premios",s:["Presenta la palma abierta a 5 cm de su nariz.","Cuando la toque con el hocico: clic y premio.","Retira la mano y vuelve a presentarla, a distintos lados y alturas.","Añade «toca». Aleja la mano para que tenga que caminar hacia ella."],tip:"Útil para recolocarla, para llamadas cortas y para subir a la báscula.",bad:"Acercar la mano a su nariz: es ella quien debe ir a la mano.",ok:"Toca la mano con la palabra desde 2 m."},
{id:"choca",cat:"tricks",n:"Choca la pata",d:1,m:3,mat:"Premios",s:["Pide sentado. Pon un premio en tu mano cerrada a la altura de su pecho.","Muchos perros dan con la pata: en cuanto la levante, clic y premio.","Presenta después la mano abierta en vertical; clic cuando la toque.","Añade la palabra «choca»."],tip:"Prueba con las dos patas, con palabras distintas.",bad:"Cogerle la pata: tiene que ofrecerla ella.",ok:"Choca con la palabra y la mano abierta."},
{id:"gira",cat:"tricks",n:"Gira",d:1,m:3,mat:"Premios",s:["Con un premio en su nariz, dibuja un círculo amplio a la altura de su cabeza.","Al completar la vuelta: clic y premio.","Reduce el gesto hasta un pequeño giro de muñeca.","Añade «gira» y enséñalo hacia el otro lado con otra palabra («vuelta»)."],tip:"Calentamiento ideal antes de ejercicios más difíciles.",bad:"Un círculo muy cerrado: se pierde y se frustra.",ok:"Gira hacia los dos lados solo con la palabra."},
{id:"reverencia",cat:"tricks",n:"Reverencia",d:2,m:4,mat:"Premios",s:["Con {dog} de pie, lleva el premio de su nariz hacia el suelo, entre sus patas delanteras.","Clic en cuanto bajen los codos con el trasero aún arriba (antes de que se tumbe).","Al principio puedes poner el brazo bajo su tripa para ayudar.","Añade la palabra «reverencia»."],tip:"Captura también las reverencias espontáneas al estirarse.",bad:"Clic tarde: si se tumba entera, estarás premiando el tumbado.",ok:"Hace la reverencia con la palabra 3 veces seguidas."},
{id:"manejo",cat:"care",n:"Manejo de patas y orejas",d:1,m:2,mat:"Premios",s:["Toca brevemente un hombro: clic y premio.","Desliza la mano hacia una pata y tócala 1 segundo: clic y premio.","Progresa: sujetar la pata 1 s → 3 s → tocar uñas.","Igual con orejas, boca y cola.","Si se aparta, respétalo y vuelve a un paso más fácil."],tip:"Sesiones de 1–2 minutos. Prepara visitas al veterinario y el corte de uñas.",bad:"Sujetarla a la fuerza: rompe la confianza que estás construyendo.",ok:"Deja tocar las 4 patas y las orejas relajada."},
{id:"cepillo",cat:"care",n:"Cepillado positivo",d:1,m:3,mat:"Cepillo · premios",s:["Enseña el cepillo: clic y premio. Repite hasta que lo mire con interés.","Toca su lomo con el dorso del cepillo: clic y premio.","Una pasada suave → premio. Luego 2–3 pasadas por premio.","Para antes de que se canse o se mueva."],tip:"Empieza por zonas que le gusten (lomo) y deja las sensibles para más adelante.",bad:"Hacer sesiones largas porque está quieta: termina siempre en positivo.",ok:"Acepta 1 min de cepillado con premios espaciados."},
{id:"miraeso",cat:"care",n:"Mira eso (estímulos)",d:3,m:5,mat:"Premios top · distancia",s:["Busca una distancia en la que {dog} vea el estímulo (perro, bici) y siga tranquila.","En el momento en que lo mire: clic y premio.","Pronto mirará el estímulo y luego a ti, esperando el clic: eso es lo que buscas.","Si ladra, tira o se queda fija: aléjate. Estás demasiado cerca.","Reduce la distancia muy poco a poco, en días distintos."],tip:"La distancia es tu mejor herramienta. Mejor lejos y con éxito que cerca y con tensión.",bad:"Acercarte demasiado rápido: un mal encuentro retrasa semanas.",ok:"Mira a un perro a 10 m y vuelve a mirarte tranquila."},
{id:"rodar",cat:"tricks",n:"Rodar",d:2,m:4,mat:"Premios · alfombra",s:["Pide tumbado.","Lleva el premio desde su nariz hacia su hombro, para que se tumbe de lado.","Sigue el movimiento por encima del lomo para que gire sobre la espalda.","Cuando complete la vuelta: «muy bien» y premio.","Reduce el gesto a un giro de mano y añade «rueda»."],tip:"Hazlo en superficie blanda y siempre hacia el mismo lado al principio.",bad:"Empujarla para que gire: tiene que seguir el premio ella.",ok:"Rueda completa con la palabra y un gesto pequeño."},
{id:"bang",cat:"tricks",n:"¡Bang! (hacerse la muerta)",d:3,m:4,mat:"Premios · alfombra",s:["Empieza desde tumbado de lado (la mitad de «rodar»).","Premia cuando se quede tumbada de lado, quieta, 1 s.","Alarga a 3–5 s antes de premiar.","Añade la señal: «¡bang!» con la mano en forma de pistola.","Libera con «ale»."],tip:"Enséñalo después de «rodar»: comparten el primer paso.",bad:"Premiar mientras se levanta: el premio va en el suelo, tumbada.",ok:"Se tumba de lado con «¡bang!» y aguanta 5 s."},
{id:"ochos",cat:"tricks",n:"Ochos entre piernas",d:2,m:4,mat:"Premios",s:["De pie con las piernas abiertas, guía a {dog} con un premio para que pase entre ellas.","Llévala alrededor de una pierna y de vuelta por el centro.","Repite por la otra pierna para dibujar un 8.","Reduce el señuelo a un gesto con la mano y añade «ochos»."],tip:"Coordina vuestro movimiento: muy bueno para el vínculo y el paseo dirigido.",bad:"Ir muy rápido al principio: primero medio ocho, luego uno entero.",ok:"Hace 2 ochos seguidos con un gesto de mano."},
{id:"atras",cat:"tricks",n:"Marcha atrás",d:2,m:3,mat:"Premios · un pasillo",s:["En un pasillo estrecho, colócate frente a ella.","Da un paso pequeño hacia ella; si recula un paso: «muy bien» y premio.","Pide 2 o 3 pasos antes de premiar.","Añade la palabra «atrás»."],tip:"Le da conciencia de las patas traseras: base para muchos trucos.",bad:"Echarte encima: el paso tiene que ser suave.",ok:"Recula 3 pasos con la palabra, sin pasillo."},
{id:"patas",cat:"tricks",n:"Patas arriba (en un objeto)",d:1,m:3,mat:"Caja o escalón estable",s:["Pon un escalón o caja estable delante de ella.","Guíala con el premio para que suba las patas delanteras.","Con las dos patas arriba: «muy bien» y premio.","Añade «arriba» y prueba con otros objetos seguros."],tip:"El objeto tiene que ser firme: si se mueve, le cogerá miedo.",bad:"Objetos inestables o resbaladizos.",ok:"Sube las patas a 3 objetos distintos con la palabra."},
{id:"verguenza",cat:"tricks",n:"Vergüenza (pata al hocico)",d:3,m:4,mat:"Pegatina o cinta suave",s:["Pega un trocito de cinta suave en su hocico.","Cuando levante la pata para quitársela: «muy bien» y premio.","Repite y retira la cinta cuando ya levante la pata hacia el hocico.","Añade «¿vergüenza?»."],tip:"Truco muy vistoso; tiene que ser un juego, nunca una molestia.",bad:"Cinta que tire del pelo: usa algo muy suave o un post-it.",ok:"Se tapa el hocico con la pata con la palabra."},
{id:"nombres",cat:"tricks",n:"Trae por nombre",d:3,m:5,mat:"2–3 juguetes distintos",s:["Nombra un juguete mientras juegas con él («pelota»).","Ponlo en el suelo y pide «trae la pelota»: «muy bien» y juego al traerlo.","Añade un segundo juguete al lado y pide solo la pelota.","Si trae el otro: «no» informativo y vuelve a pedir.","Cuando acierte, enseña el nombre del segundo juguete."],tip:"Discriminación: combina con «Pulsa si sabes».",bad:"Cambiar de sitio los juguetes siempre igual: así aprende posiciones, no nombres.",ok:"Trae el juguete correcto entre 2, 4 de cada 5 veces."},
{id:"saludo",cat:"extra",n:"Saludo sin saltar",d:2,m:5,mat:"Una persona ayudante · premios",s:["Con correa, que una persona se acerque despacio a {dog}.","Si se mantiene con las cuatro patas en el suelo, la persona sigue acercándose.","Si salta: «no» informativo y la persona se gira y se aleja un paso.","Cuando esté a su lado con las cuatro patas en el suelo: «muy bien», premio y la persona la saluda con calma.","Libera con «ale» y repite con otras personas."],tip:"El saludo es el premio: solo llega con las cuatro patas en el suelo.",bad:"Saludarla o tocarla mientras salta, aunque sea para apartarla: también es atención.",ok:"Recibe a una persona sin saltar, 4 de cada 5 veces."},
{id:"bordillo",cat:"extra",n:"Sentarse en el bordillo",d:1,m:5,mat:"Correa · premios",s:["Al llegar a un bordillo, para antes del borde.","Pide sentado.","Cuando se siente: «muy bien» y premio.","Espera 2–3 s, mira a los lados y cruzad con «ale».","Repítelo en cada cruce del paseo."],tip:"Con práctica se sentará sola al llegar al bordillo: premia mucho esas veces.",bad:"Cruzar sin que se haya sentado «porque hay prisa»: el criterio se rompe enseguida.",ok:"Se sienta en el bordillo sin que se lo pidas."},
{id:"emergencia",cat:"extra",n:"Llamada de emergencia",d:2,m:3,mat:"Premio especial (jamón, queso, salchicha)",s:["Elige una palabra o silbato que no uses nunca para nada más.","Dila una vez y dale inmediatamente un premio especial y abundante («jackpot»), aunque no haya hecho nada.","Repite 5 veces al día durante una semana, en casa.","Empieza a decirla cuando esté a 1–2 m y celébralo a lo grande al llegar.","Úsala de verdad solo en emergencias, y repásala cada semana para que no pierda valor."],tip:"Esta llamada siempre paga con lo mejor que tengas: es tu seguro de vida.",bad:"Usarla para algo desagradable, o gastarla en llamadas del día a día.",ok:"Corre hacia ti al instante desde cualquier situación, en casa y en zona segura."},
{id:"campana",cat:"tricks",n:"Toca la campana",d:1,m:3,mat:"Timbre de mesa o campana · premios",s:["Empieza con el toque de mano (target).","Pon la mano detrás del timbre: al tocar la mano, tocará el timbre. «Muy bien» en cuanto suene.","Retira la mano poco a poco: premia cuando toque el timbre solo.","Añade «campana»."],tip:"Base del target: si «toca» ya le sale, esto es rapidísimo.",bad:"Un timbre que suene muy fuerte al principio: puede asustarla.",ok:"Toca el timbre con la palabra, desde 1 m."},
{id:"otra",cat:"tricks",n:"Dame la otra",d:1,m:3,mat:"Premios",s:["Pide «choca» con la pata de siempre.","Presenta tu mano hacia el lado contrario y espera a que levante la otra pata.","Al levantarla: «muy bien» y premio.","Ponle su propia palabra («la otra») y alterna las dos."],tip:"Discriminación: cada pata tiene su palabra.",bad:"Premiar si da la pata equivocada: «no» informativo y vuelve a pedir.",ok:"Da la pata correcta según la palabra, 4 de cada 5."},
{id:"besito",cat:"tricks",n:"Besito",d:1,m:2,mat:"Premios · un poco de crema o queso en la mano",s:["Pon un poco de algo rico en el dorso de tu mano.","Cuando la toque con el hocico: «muy bien» y premio de la otra mano.","Repite sin nada en la mano.","Acerca la mano a tu mejilla y añade «besito»."],tip:"Si es muy lamedora, premia el toque con el hocico, no el lametón.",bad:"Acercar tu cara a su cara de golpe: tiene que venir ella.",ok:"Te da un toque en la mejilla con la palabra."},
{id:"barbilla",cat:"tricks",n:"Cabeza abajo (barbilla)",d:1,m:3,mat:"Premios · una toalla doblada",s:["Pon la palma de tu mano abierta bajo su barbilla, sin tocarla.","Cuando apoye la barbilla aunque sea un instante: «muy bien» y premio.","Alarga el tiempo de apoyo: 1 s, 3 s, 5 s.","Cambia la mano por una toalla o el suelo y añade «barbilla»."],tip:"Muy útil en el veterinario: mantiene la cabeza quieta por voluntad propia.",bad:"Sujetarle la cabeza: el apoyo tiene que ofrecerlo ella.",ok:"Apoya la barbilla 10 s en tu mano o en una toalla."},
{id:"aro",cat:"tricks",n:"Saltar el aro",d:2,m:4,mat:"Aro de hula hoop · premios",s:["Sujeta el aro tocando el suelo y lanza un premio al otro lado: que pase a través.","Cuando lo cruce: «muy bien».","Sube el aro unos centímetros cada vez.","Añade «hop» y termina con «Nada más» para que se calme."],tip:"Saltos bajos y en suelo que no resbale. Si es joven, consulta la altura con tu veterinario.",bad:"Subir la altura demasiado rápido.",ok:"Salta el aro a la altura de sus codos con la palabra."},
{id:"gatear",cat:"tricks",n:"Gatear",d:2,m:4,mat:"Premios · alfombra",s:["Pide tumbado.","Lleva el premio pegado al suelo, despacio, hacia delante.","Si avanza sin levantarse: «muy bien» y premio. Si se levanta, vuelve a empezar.","Alarga la distancia y añade «gatea»."],tip:"Ponerte de rodillas y hacer un túnel con tus piernas ayuda al principio.",bad:"Mover el premio demasiado rápido: se levantará para seguirlo.",ok:"Gatea 1 m sin levantarse."},
{id:"recoger",cat:"tricks",n:"Recoger juguetes",d:2,m:5,mat:"Caja baja · 3 juguetes",s:["Pide «trae» con un juguete, sujetando la caja debajo de su boca.","Pide «suelta»: el juguete cae en la caja. «Muy bien» y premio.","Aleja poco a poco la caja de tu mano y ponla en el suelo.","Añade «recoge» y suma más juguetes."],tip:"Encadena trae, suelta y target: practica antes cada parte.",bad:"Premiar si suelta fuera de la caja.",ok:"Mete 3 juguetes en la caja con una sola palabra."},

function PROG(e){return !!CATS[e.cat].ses}
function okCount(id,l){var n=0;state.sessions.forEach(function(s){if(s.ex===id&&s.lv===l&&s.ok)n++});return n}
function lvDone(id){var d=0;for(var l=1;l<=3;l++){if(okCount(id,l)>=2)d=l;else break}return d}
function gDone(){return EX.filter(PROG).every(function(e){return lvDone(e.id)>=3})}
function gLevel(){var m=3;EX.filter(PROG).forEach(function(e){m=Math.min(m,lvDone(e.id)+1)});return Math.max(1,Math.min(m,3))}
function gCount(){var g=gLevel();return EX.filter(PROG).filter(function(e){return lvDone(e.id)>=g}).length}
function curLv(e){var d=lvDone(e.id);return PROG(e)?Math.min(d+1,gLevel(),3):Math.min(d+1,3)}
function waiting(e){return PROG(e)&&!gDone()&&lvDone(e.id)>=gLevel()}
function stat(e){var d=lvDone(e.id);if(d>=3)return["Completado","done"];if(waiting(e))return["Nivel "+d+" ✓ · espera al resto","done"];var l=curLv(e),k=okCount(e.id,l);return["Nivel "+l+" · "+k+"/2",(k||d)?"":"new"]}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dog(s){var t=esc(s).replace(/\{dog\}/g,esc(state.dog));t=t.replace(/\bclic\b/g,"«muy bien»").replace(/\bClic\b/g,"«Muy bien»");return t}
function pad(n){return n<10?"0"+n:""+n}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function mon(d){var x=new Date(d);var w=(x.getDay()+6)%7;return addD(x,-w)}
function svg(cat,cls){return '<svg viewBox="0 0 24 24" style="stroke:'+CATS[cat].c+';fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round">'+ICON[cat]+'</svg>'}
function cvE(e){var T=TYPES[e.ty];return "--c:"+T.c+";--t:"+T.t}
function svgE(e){var T=TYPES[e.ty];return '<svg viewBox="0 0 24 24" style="stroke:'+T.c+';fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round">'+ICON[T.i]+'</svg>'}
function cv(cat){return '--c:'+CATS[cat].c+';--t:'+CATS[cat].t}
function mastery(id){return Math.round(lvDone(id)/3*100)}
function status(m){return m>=100?["Dominado","done"]:m>=40?["Practicando",""]:m>0?["Aprendiendo",""]:["Nuevo","new"]}
function catPct(cat){var l=EX.filter(function(e){return e.cat===cat});var s=0;l.forEach(function(e){s+=mastery(e.id)});return Math.round(s/l.length)}
function xp(){var p=0;state.sessions.forEach(function(s){p+=PTS[s.rating]||0});return p}
function byDay(){var m={};state.sessions.forEach(function(s){var k=dkey(new Date(s.t));m[k]=(m[k]||0)+1});return m}
function streak(){var m=byDay(),d=today(),n=0;if(!m[dkey(d)])d=addD(d,-1);while(m[dkey(d)]){n++;d=addD(d,-1)}return n}
function bestStreak(){var ks=Object.keys(byDay()).sort();var b=0,c=0,prev=null;ks.forEach(function(k){var d=new Date(k+"T00:00:00");if(prev&&dkey(addD(prev,1))===k)c++;else c=1;b=Math.max(b,c);prev=d});return b}
function weekCount(){var s=mon(today()).getTime(),d={};state.sessions.forEach(function(x){var t=new Date(x.t);if(t.getTime()>=s)d[dkey(t)]=1});return Object.keys(d).length}
function dots(d){var h='<span class="dots">';for(var i=1;i<=3;i++)h+='<i class="'+(i<=d?"f":"")+'"></i>';return h+'</span>'}
function plan(){var lv=gLevel(),l;
 if(state.goal==="toca"){l=EX.filter(function(e){return PROG(e)&&lvDone(e.id)<lv});l.sort(function(a,b){return okCount(b.id,lv)-okCount(a.id,lv)||lastT(a.id)-lastT(b.id)});return l.slice(0,6)}
 l=EX.filter(function(e){return e.ty===state.goal});
 l.sort(function(a,b){var wa=(lvDone(a.id)>=3||waiting(a))?1:0,wb=(lvDone(b.id)>=3||waiting(b))?1:0;return wa-wb});return l}
function lastT(id){var t=0;state.sessions.forEach(function(s){if(s.ex===id)t=Math.max(t,new Date(s.t).getTime())});return t}
function fmtDate(t){var d=new Date(t);var td=today();var k=dkey(d);if(k===dkey(td))return "Hoy";if(k===dkey(addD(td,-1)))return "Ayer";return d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on")},1800)}

function histFails(e){var ss=state.sessions.filter(function(x){return x.ex===e.id&&x.log}).slice(-5);if(!ss.length)return "";var all=[];ss.forEach(function(x){all=all.concat(x.log)});var best=0;ss.forEach(function(x){best=Math.max(best,x.hold||0)});return '<div class="h4">Dónde falla · últimas '+ss.length+' sesiones</div>'+failBlock(e,all)+(best?'<p class="sub" style="margin-top:8px">Mejor aguante registrado: <b>'+fmt1(best)+'</b></p>':'')}
function lvList(e){var d=lvDone(e.id),c=curLv(e),g=gLevel();return '<div class="lvs">'+e.lv.map(function(t,i){var l=i+1,cls=l<=d?"ok":(PROG(e)&&l>g?"lock":(l===c?"cur":""));return '<div class="lvi '+cls+'"><span>'+(l<=d?'✓':cls==="lock"?'🔒':l)+'</span><div><b>Nivel '+l+(l===c&&l>d?' · '+okCount(e.id,l)+'/2 sesiones':'')+'</b>'+dog(t)+'</div></div>'}).join("")+'</div>'}
function detail(id){
 var e=EXI[id],m=mastery(id),st=stat(e),O=document.getElementById("overlay");
 O.innerHTML='<div class="scrim" data-a="close"></div><div class="sheet" style="'+cvE(e)+'"><div class="sh-top"><button class="x" data-a="close">×</button><div class="tile">'+svgE(e)+'</div><span class="cat">'+TYPES[e.ty].n+'</span><h3>'+dog(e.n)+'</h3>'+(e.v?'<a class="vid" href="'+e.v+'" target="_blank" rel="noopener">▶ Ver vídeo de la educadora</a>':'')+'</div><div class="sh-bd"><div class="facts"><div class="fact"><small>Nivel</small><b>'+DIFF[e.d]+'</b></div><div class="fact"><small>Duración</small><b>'+e.m+' min</b></div><div class="fact"><small>Estado</small><b>'+st[0]+'</b></div></div><div class="fact" style="margin-bottom:6px"><small>Material</small><b>'+esc(e.mat)+'</b></div><div class="h4">Niveles</div>'+lvList(e)+'<div class="h4">Pasos</div><ol class="steps-l">'+e.s.map(function(s){return '<li>'+dog(s)+'</li>'}).join("")+'</ol><div class="h4">Antes de empezar</div><div style="display:flex;flex-direction:column;gap:8px"><div class="note-b n-tip"><b>Consejo</b>'+dog(e.tip)+'</div><div class="note-b n-bad"><b>Error frecuente</b>'+dog(e.bad)+'</div><div class="note-b n-ok"><b>Lo tiene cuando…</b>'+dog(e.ok)+'</div>'+(e.gap?'<div class="note-b n-gap"><b>Falta confirmar con la educadora</b>'+dog(e.gap)+'</div>':'')+'</div>'+(e.pyr?'<div class="h4">Desglose piramidal</div>'+pyr(e,-1):'')+histFails(e)+'</div><div class="sh-cta"><button class="big" data-a="start" data-id="'+id+'">Empezar ejercicio guiado</button></div></div>';
 O.classList.add("on");
}
function closeO(){if(G&&G.ch&&G.ch.run)clearInterval(G.ch.tid);stopTimer();G=null;if(Q){Q=null;if(PEND)save()}var O=document.getElementById("overlay");O.classList.remove("on");O.innerHTML=""}

/* ---------- guided ---------- */
var G=null,AC=null;
function snd(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;[0,0.065].forEach(function(o,i){var os=AC.createOscillator(),g=AC.createGain();os.type="square";os.frequency.setValueAtTime(i?1900:2600,t+o);os.frequency.exponentialRampToValueAtTime(700,t+o+0.025);g.gain.setValueAtTime(0.0001,t+o);g.gain.exponentialRampToValueAtTime(i?0.25:0.45,t+o+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.04);os.connect(g);g.connect(AC.destination);os.start(t+o);os.stop(t+o+0.05)})}catch(e){}}
function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;[0,0.22,0.44].forEach(function(o){var os=AC.createOscillator(),g=AC.createGain();os.frequency.value=880;g.gain.setValueAtTime(0.0001,t+o);g.gain.exponentialRampToValueAtTime(0.25,t+o+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.18);os.connect(g);g.connect(AC.destination);os.start(t+o);os.stop(t+o+0.2)})}catch(e){}}
function accTxt(){var t=G.rewards+G.miss,p=t?Math.round(G.rewards/t*100):0;return '<b>'+G.rewards+'</b> aciertos · '+G.miss+' no'+(t?' · <span class="'+(p>=80&&t>=5?"g80":"")+'">'+p+'%</span>':'')}
function start(id){
 var e=EXI[id];stopTimer();
 G={ex:id,lv:curLv(e),ok:false,log:[],ch:{run:false,t0:0,cur:0,best:0,holds:[]},step:0,rewards:0,miss:0,total:e.m*60,left:e.m*60,run:false,elapsed:0,phase:"steps",rating:0,note:""};
 var O=document.getElementById("overlay");O.classList.add("on");renderG();
}
function stopTimer(){if(G&&G.tid){clearInterval(G.tid);G.tid=null}if(G)G.run=false}
function toggleTimer(){
 if(!G)return;
 if(G.run){stopTimer();renderTimer();return}
 if(G.left<=0)G.left=G.total;
 G.run=true;var last=Date.now();
 G.tid=setInterval(function(){var n=Date.now(),dt=(n-last)/1000;last=n;G.left=Math.max(0,G.left-dt);G.elapsed+=dt;if(G.left<=0){stopTimer();beep();toast("¡Tiempo! Termina con algo fácil")}renderTimer()},250);
 renderTimer();
}
function fmt(s){s=Math.ceil(s);return Math.floor(s/60)+":"+pad(s%60)}
function tSecs(t){var m=/(\d+)\s*(min|s)\b/.exec(t||"");if(!m)return 0;return m[2]==="min"?+m[1]*60:+m[1]}
function fmt1(s){var m=Math.floor(s/60),r=s-m*60;return m+":"+(r<10?"0":"")+r.toFixed(1)}
function chStop(silent){var c=G.ch;if(!c.run)return;clearInterval(c.tid);c.run=false;c.holds.push(c.cur);c.best=Math.max(c.best,c.cur);if(!silent)renderChrono()}
function chToggle(){var c=G.ch;if(c.run){chStop();return}c.run=true;c.cur=0;c.t0=Date.now();c.hit=false;var tg=tSecs(EXI[G.ex].lv[G.lv-1]);
 c.tid=setInterval(function(){c.cur=(Date.now()-c.t0)/1000;if(tg&&!c.hit&&c.cur>=tg){c.hit=true;beep()}paintChrono()},100);renderChrono()}
function paintChrono(){var el=document.getElementById("chv");if(!el)return;var c=G.ch,tg=tSecs(EXI[G.ex].lv[G.lv-1]);el.textContent=fmt1(c.cur);var b=document.getElementById("chb");if(b&&tg)b.style.width=Math.min(100,c.cur/tg*100)+"%";var w=document.getElementById("chr");if(w)w.classList.toggle("hit",!!(tg&&c.cur>=tg))}
function renderChrono(){var el=document.getElementById("chr");if(!el||!G)return;var c=G.ch,tg=tSecs(EXI[G.ex].lv[G.lv-1]);
 el.className="chrono"+(tg&&c.cur>=tg?" hit":"");
 el.innerHTML='<div class="ch-l"><span>Cronómetro de aguante'+(tg?' · objetivo '+fmt(tg):'')+'</span><b id="chv">'+fmt1(c.cur)+'</b>'+(tg?'<div class="bar"><i id="chb" style="width:'+Math.min(100,c.cur/tg*100)+'%"></i></div>':'')+'<small>'+(c.holds.length?'Mejor: '+fmt1(c.best)+' · '+c.holds.length+' intento'+(c.holds.length>1?'s':''):'Púlsalo cuando empiece a aguantar y páralo cuando se mueva.')+'</small></div><button class="ch-b'+(c.run?' on':'')+'" data-a="chrono">'+(c.run?'Parar':'Iniciar')+'</button>'}
function renderPyrLive(){var el=document.getElementById("pyrlive");if(el)el.innerHTML=pyr(EXI[G.ex],G.pyr==null?0:G.pyr,G.log)}
function failSummary(e,log){var f={},tot=0;log.forEach(function(x){if(x[0]===0){tot++;var k=e.pyr&&x[1]!=null?e.pyr[x[1]][0]+' · '+e.pyr[x[1]][1]:'Paso '+(x[2]+1);f[k]=(f[k]||0)+1}});return {tot:tot,list:Object.keys(f).map(function(k){return [k,f[k]]}).sort(function(a,b){return b[1]-a[1]})}}
function renderTimer(){
 var el=document.getElementById("tmr");if(!el||!G)return;
 var C=2*Math.PI*46,p=G.left/G.total;
 el.innerHTML='<svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="#EEEDF5" stroke-width="9"/><circle cx="55" cy="55" r="46" fill="none" stroke="'+TYPES[EXI[G.ex].ty].c+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p))+'" transform="rotate(-90 55 55)"/><text x="55" y="63" text-anchor="middle" class="tt">'+fmt(G.left)+'</text></svg><button data-a="timer">'+(G.run?"Pausar":G.left<G.total?"Seguir":"Iniciar")+'</button>';
}
function renderG(){
 var e=EXI[G.ex],O=document.getElementById("overlay"),h;
 if(G.phase==="steps"){
  var last=G.step===e.s.length-1,pr="";for(var i=0;i<e.s.length;i++)pr+='<i class="'+(i<=G.step?"on":"")+'"></i>';
  h='<div class="guide" style="'+cvE(e)+'"><div class="g-in"><div class="g-head"><button class="x" data-a="close">×</button>'+(Q?'<span class="qtag">'+(Q.i+1)+'/'+Q.list.length+'</span>':'')+'<b>'+dog(e.n)+'</b><span class="badge" style="background:var(--t);color:var(--c)">'+TYPES[e.ty].n+'</span></div><div class="prog">'+pr+'</div><div class="lvgoal"><span>Nivel '+G.lv+' · objetivo</span><b>'+dog(e.lv[G.lv-1])+'</b></div><div class="stepcard"><span class="sn">Paso '+(G.step+1)+' de '+e.s.length+'</span><p>'+dog(e.s[G.step])+'</p></div>'+(e.pyr?'<div class="h4" style="margin-top:16px">Pirámide · toca la repetición que estás haciendo</div>'+'<div id="pyrlive">'+pyr(e,G.pyr==null?0:G.pyr,G.log)+'</div>':'')+'<div class="nav"><button data-a="prev"'+(G.step===0?" disabled":"")+'>Anterior</button><button class="pri" data-a="next">'+(last?"Terminar sesión":"Siguiente")+'</button></div><div class="chrono" id="chr"></div><div class="tools"><div class="timer" id="tmr"></div><div class="clk"><button class="clicker voz" id="clicker" data-a="click">'+"MUY<br>BIEN"+'</button><div class="cnt" id="rw">'+accTxt()+'</div><div class="mk"><button class="nob" data-a="miss">No</button></div><small>Espacio = acierto · N = no</small></div></div>'+(e.v?'<a class="vid" style="margin-top:14px;display:inline-block" href="'+e.v+'" target="_blank" rel="noopener">▶ Ver vídeo de la educadora</a>':'')+'<div class="note-b n-tip g-tip"><b>Consejo</b>'+dog(e.tip)+'</div></div></div>';
  O.innerHTML=h;renderTimer();renderChrono();
 }else if(G.phase==="rate"){
  var secs=Math.round(G.elapsed);
  h='<div class="guide" style="'+cvE(e)+'"><div class="g-in"><div class="g-head"><button class="x" data-a="close">×</button><b>'+dog(e.n)+'</b></div><div class="celebrate" style="margin-top:22px"><h3>¡Sesión terminada!</h3><p>¿Cómo le ha ido a '+esc(state.dog)+'?</p></div><div class="rategrid">';
  [1,2,3].forEach(function(k){var r=RATES[k];h+='<button class="rt'+(G.rating===k?" on":"")+'" data-a="rate" data-v="'+k+'"><span class="face" style="background:'+r.t+'"><svg viewBox="0 0 24 24" style="stroke:'+r.c+'">'+r.f+'</svg></span>'+r.l+'</button>'});
  h+='</div><div class="sum">'+(G.ch.best?'<div class="fact"><small>Mejor aguante</small><b>'+fmt1(G.ch.best)+'</b></div>':'')+'<div class="fact"><small>Tiempo</small><b>'+(secs>0?fmt(secs):"—")+'</b></div><div class="fact"><small>Aciertos</small><b>'+G.rewards+(G.miss?' / '+(G.rewards+G.miss)+' · '+Math.round(G.rewards/(G.rewards+G.miss)*100)+'%':'')+'</b></div></div>'+((G.rewards+G.miss)>=5&&G.rewards/(G.rewards+G.miss)>=0.8?'<div class="note-b n-ok" style="margin-top:10px"><b>Regla del 80 %</b>¡'+G.rewards+' de '+(G.rewards+G.miss)+'! '+esc(state.dog)+' está lista para subir de nivel.</div>':'')+'<div class="h4">Dónde ha fallado</div>'+failBlock(e,G.log)+'<div class="h4">Notas (opcional)</div><textarea class="notes" id="gnote" placeholder="Qué funcionó, en qué se distrajo, qué premio usaste…">'+esc(G.note)+'</textarea><button class="okt'+(G.ok?" on":"")+'" data-a="okt"><span>'+(G.ok?'✓':'')+'</span><div><b>Ha cumplido el objetivo del nivel '+G.lv+'</b>'+dog(e.lv[G.lv-1])+'</div></button><div class="finish"><button class="big" data-a="savesess"'+(G.rating?"":' disabled style="opacity:.4"')+'>'+(Q&&Q.i+1<Q.list.length?'Guardar y siguiente ejercicio':'Guardar sesión')+'</button>'+(Q&&Q.i+1<Q.list.length?'<p class="sub" style="text-align:center;margin:8px 0 0">Antes del siguiente: 1 min de juego o descanso.</p>':'')+'<div class="nav"><button data-a="back">Volver a los pasos</button></div></div></div></div>';
  O.innerHTML=h;
 }
}
function failBlock(e,log){var f=failSummary(e,log);if(!f.tot)return '<p class="sub" style="margin:0">Sin fallos marcados con «No».</p>';return '<div class="fails">'+f.list.map(function(x){return '<span class="fl"><b>'+dog(x[0])+'</b> ✗'+x[1]+'</span>'}).join("")+'</div>'+(f.list[0][1]>=2?'<div class="note-b n-tip" style="margin-top:8px"><b>Sugerencia</b>Donde más falla es «'+dog(f.list[0][0])+'». Haz esa parte más fácil la próxima vez y vuelve a subir poco a poco.</div>':'')}
function saveSession(){
 var e=EXI[G.ex],before=lvDone(G.ex),gb=gLevel(),gdb=gDone();
 var n=document.getElementById("gnote");if(n)G.note=n.value.trim().slice(0,300);
 var secs=Math.round(G.elapsed);if(secs<30)secs=e.m*60;
 state.sessions.push({id:Date.now().toString(36),t:new Date().toISOString(),ex:G.ex,lv:G.lv,ok:G.ok,rating:G.rating,rewards:G.rewards,miss:G.miss,log:G.log,hold:Math.round(G.ch.best),secs:secs,note:G.note});
 var after=lvDone(G.ex),ga=gLevel(),wasOk=G.ok;
 var nxt=Q&&Q.i+1<Q.list.length?Q.list[Q.i+1]:null;
 if(nxt){Q.i++;stopTimer();render();start(nxt);save(("Siguiente: "+EXI[nxt].n).replace("{dog}",state.dog));return}
 Q=null;closeO();render();autoBackup();
 save((ga>gb||(!gdb&&gDone()))?"¡"+state.dog+" sube al nivel "+ga+"!":after>before?"Nivel "+after+" superado en «"+e.n.replace("{dog}",state.dog)+"»":wasOk?"Sesión guardada · objetivo cumplido":"Sesión guardada");
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
 var b=ev.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a"),v=b.getAttribute("data-v"),id=b.getAttribute("data-id");
 if(a==="tab"){view=v;location.hash=v;render();window.scrollTo({top:0})}
 else if(a==="goal"){state.goal=v;render();save();var pl=document.getElementById("plan");if(pl)pl.scrollIntoView({behavior:"smooth",block:"start"})}
 else if(a==="today")startQueue();
 else if(a==="levels"){LVV=gLevel();levelsSheet()}
 else if(a==="lvv"){LVV=+v;levelsSheet()}
 else if(a==="wk"){state.weekly=Math.max(1,Math.min(14,state.weekly+(+v)));render();save()}
 else if(a==="detail")detail(id);
 else if(a==="start")start(id);
 else if(a==="close")closeO();
 else if(a==="lc"){libCat=v;render()}
 else if(a==="editname"){editing=true;render()}
 else if(a==="savename"){var n=document.getElementById("namein").value.trim();if(n)state.dog=n.slice(0,20);editing=false;render();save()}
 else if(a==="prev"){if(G.step>0){G.step--;renderG()}}
 else if(a==="next"){var e=EXI[G.ex];if(G.step<e.s.length-1){G.step++;renderG()}else{stopTimer();chStop(true);var tt=G.rewards+G.miss,tg=tSecs(e.lv[G.lv-1]);G.ok=(tt>=5&&G.rewards/tt>=0.8)||(!!tg&&G.ch.best>=tg);G.phase="rate";renderG()}}
 else if(a==="back"){var nn=document.getElementById("gnote");if(nn)G.note=nn.value;G.phase="steps";renderG()}
 else if(a==="click"){G.rewards++;G.log.push([1,G.pyr==null?(EXI[G.ex].pyr?0:null):G.pyr,G.step]);if(EXI[G.ex].pyr)renderPyrLive();var r=document.getElementById("rw");if(r)r.innerHTML=accTxt()}
 else if(a==="okt"){var gn=document.getElementById("gnote");if(gn)G.note=gn.value;G.ok=!G.ok;renderG()}
 else if(a==="bkdrive")driveBackup(false);
 else if(a==="bkdl"){var fn="maya-entreno-"+dkey(today())+".json";if(DL)DL.save({filename:fn,data:bkData()}).catch(function(){toast("Descarga cancelada")});else{var u=URL.createObjectURL(new Blob([bkData()],{type:"application/json"}));var l=document.createElement("a");l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000);state.backup=state.backup||{};state.backup.last=dkey(today());save("Copia descargada")}}
 else if(a==="bkok"){if(RST){var keep=state.backup;state=RST;state.backup=keep;RST=null;render();save("Copia restaurada")}}
 else if(a==="bkno"){RST=null;render()}
 else if(a==="pyr"){if(G){G.pyr=+v;renderG()}}
 else if(a==="miss"){G.miss++;G.log.push([0,G.pyr==null?(EXI[G.ex].pyr?0:null):G.pyr,G.step]);if(EXI[G.ex].pyr)renderPyrLive();var r2=document.getElementById("rw");if(r2)r2.innerHTML=accTxt()}
 else if(a==="marker"){state.marker=state.marker==="voz"?"clic":"voz";try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}renderG()}
 else if(a==="rt"||a==="rtm"){var k=dkey(today());state.daily=state.daily||{};var rec=state.daily[k]||(state.daily[k]={});var it=ROUT.filter(function(x){return x.k===v})[0];if(it.check)rec[v]=rec[v]?0:1;else rec[v]=Math.max(0,(rec[v]||0)+(a==="rt"?1:-1));render();clearTimeout(window._rs);window._rs=setTimeout(function(){save()},2500)}
 else if(a==="timer")toggleTimer();
 else if(a==="chrono")chToggle();
 else if(a==="rate"){var nt=document.getElementById("gnote");if(nt)G.note=nt.value;G.rating=+v;renderG()}
 else if(a==="savesess"){if(G.rating)saveSession()}
 else if(a==="del"){if(b.classList.contains("arm")){state.sessions=state.sessions.filter(function(s){return s.id!==id});render();save("Sesión borrada")}else{b.classList.add("arm");b.textContent="¿Seguro?";setTimeout(function(){b.classList.remove("arm");b.textContent="Borrar"},2500)}}
});
document.addEventListener("change",function(ev){if(ev.target.id==="bkin"&&ev.target.files[0]){var r=new FileReader();r.onload=function(){restore(r.result)};r.readAsText(ev.target.files[0])}});
document.addEventListener("input",function(ev){if(ev.target.id==="q"){libQ=ev.target.value;document.getElementById("libgrid").innerHTML=libGrid()}});
document.addEventListener("keydown",function(ev){
 if(ev.target.id==="namein"&&ev.key==="Enter"){document.querySelector('[data-a="savename"]').click();return}
 if(ev.key==="Escape"&&document.getElementById("overlay").classList.contains("on")){closeO();return}
 if(G&&G.phase==="steps"&&ev.code==="Space"&&ev.target.tagName!=="TEXTAREA"&&ev.target.tagName!=="INPUT"){ev.preventDefault();var c=document.getElementById("clicker");if(c){c.classList.add("hit");setTimeout(function(){c.classList.remove("hit")},90);c.click()}}
 if(G&&G.phase==="steps"&&(ev.key==="n"||ev.key==="N")&&ev.target.tagName!=="TEXTAREA"){var nb2=document.querySelector('[data-a="miss"]');if(nb2)nb2.click()}
 if(G&&G.phase==="steps"&&ev.key==="ArrowRight"){var nb=document.querySelector('[data-a="next"]');if(nb)nb.click()}
 if(G&&G.phase==="steps"&&ev.key==="ArrowLeft"){var pb=document.querySelector('[data-a="prev"]');if(pb&&!pb.disabled)pb.click()}
});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(["hoy","ejercicios","progreso"].indexOf(h)>=0&&h!==view){view=h;render()}});
render();
})();
</script></body></html>
